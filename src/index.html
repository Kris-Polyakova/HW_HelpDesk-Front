<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
</head>
<body>
  <div class="container">
    <div class="form-container _hidden">
      <form class="form add-ticket-form">
        <h2 class="form-title">Добавить тикет</h2>
        <div class="inputs-container">
          <span class="input-description">Краткое описание</span>
          <input type="text" name="name" class="form-field short-description-input">
          <span class="input-description">Подробное описание</span>
          <textarea name="description" class="form-field full-description-input"></textarea>
        </div>
        <div class="btns-container">
          <button type="button" class="control-btn cancel-btn">Отмена</button>
          <button type="button" class="control-btn ok-btn">Ок</button>
        </div>
      </form>
    </div>
    <div class="form-container _hidden">
      <form class="form change-ticket-form">
        <h2 class="form-title">Изменить тикет</h2>
        <div class="inputs-container">
          <span class="input-description">Краткое описание</span>
          <input type="text" name="name" class="form-field short-description-input">
          <span class="input-description">Подробное описание</span>
          <textarea name="description" class="form-field full-description-input"></textarea>
        </div>
        <div class="btns-container">
          <button type="button" class="control-btn cancel-btn">Отмена</button>
          <button type="button" class="control-btn ok-btn">Ок</button>
        </div>
      </form>
    </div>
    <div class="form-container _hidden">
      <form class="form delete-ticket-form">
        <h2 class="form-title">Удалить тикет</h2>
        <span>Вы уверены, что хотите удалить тикет? Это действие необратимо.</span>
        <div class="btns-container">
          <button type="button" class="control-btn cancel-btn">Отмена</button>
          <button type="button" class="control-btn ok-btn">Ок</button>
        </div>
      </form>
    </div>
    <div class="help-desk">
      <button type="button" class="control-btn add-btn">Добавить</button>
      <div class="tickets-container">
      </div>
    </div>
  </div>
</body>
</html>
